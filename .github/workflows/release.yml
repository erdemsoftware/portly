name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # protect this environment with a required reviewer so that a tag alone cannot get a signature
    environment: manifest-signing
    env:
      # empty when the secret is not set: then signing is skipped
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Use the tagged sources
        shell: pwsh
        run: |
          git checkout ${{ github.ref_name }}
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # Not optional, unlike code signing: stop here, before anything is published, when the manifests could not be
      # signed at the end. The check also fails while ManifestKeys.cs holds the placeholder or another key.
      - name: Check the manifest signing key
        shell: pwsh
        env:
          PORTLY_MANIFEST_KEY: ${{ secrets.PORTLY_MANIFEST_KEY }}
          PORTLY_MANIFEST_KEY_2: ${{ secrets.PORTLY_MANIFEST_KEY_2 }}
        run: ./tools/sign-manifests.ps1 -CheckKey
      - name: Security tests
        shell: pwsh
        timeout-minutes: 10
        run: ./tools/run-security-tests.ps1
      # Optional code signing. Add the repository secrets SIGN_PFX_BASE64 (the .pfx file, base64) and
      # SIGN_PFX_PASSWORD to sign Portly.exe and the setup programs with signtool; without them this is skipped.
      # (SignPath Foundation: see docs/03-yayinlama.md.)
      - name: Prepare code signing certificate
        if: ${{ env.SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'portly-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          "PORTLY_SIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build
        shell: pwsh
        env:
          PORTLY_SIGN_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./build.ps1 -Version $version -UpdateManifest
          Copy-Item manifest/app.json $env:RUNNER_TEMP/app.json
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = (Get-Content $env:RUNNER_TEMP/app.json -Raw | ConvertFrom-Json).notes
          $body = "$($notes.en)`n`n$($notes.tr)`n`n- **Portly-*-win10.zip**: Windows 10 / 11 (updates)`n- **Portly-*-win7.zip**: Windows 7 SP1 / 8 / 8.1 (Legacy, no updates)`n`nSHA-256: see SHA256SUMS.txt"
          gh release create '${{ github.ref_name }}' dist/* --title "Portly ${{ github.ref_name }}" --notes "$body"
      # winget / Scoop manifests filled with this release's URLs and SHA-256 (see docs/03-yayinlama.md)
      - name: Keep package manager manifests
        uses: actions/upload-artifact@v4
        with:
          name: package-manifests
          path: build/manifests
          if-no-files-found: ignore
      - name: Point the in-app updater to this release
        shell: pwsh
        env:
          PORTLY_MANIFEST_KEY: ${{ secrets.PORTLY_MANIFEST_KEY }}
          PORTLY_MANIFEST_KEY_2: ${{ secrets.PORTLY_MANIFEST_KEY_2 }}
        run: |
          git checkout -- .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git checkout -f -B main origin/main
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # the newest main (it may have moved since the checkout at the start), signed after app.json is in place
          ./tools/push-signed-manifests.ps1 -Message "Release ${{ github.ref_name }}: update manifest/app.json" -AppJson $env:RUNNER_TEMP/app.json
