name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          git checkout ${{ github.ref_name }}
          ./build.ps1 -Version $version -UpdateManifest
          Copy-Item manifest/app.json $env:RUNNER_TEMP/app.json
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = (Get-Content $env:RUNNER_TEMP/app.json -Raw | ConvertFrom-Json).notes
          $body = "$($notes.en)`n`n$($notes.tr)`n`n- **Portly-*-win10.zip**: Windows 10 / 11 (updates)`n- **Portly-*-win7.zip**: Windows 7 SP1 / 8 / 8.1 (Legacy, no updates)`n`nSHA-256: see SHA256SUMS.txt"
          gh release create '${{ github.ref_name }}' dist/* --title "Portly ${{ github.ref_name }}" --notes "$body"
      - name: Point the in-app updater to this release
        shell: pwsh
        run: |
          git checkout -- .
          git checkout main
          Copy-Item $env:RUNNER_TEMP/app.json manifest/app.json
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add manifest/app.json
          git commit -m "Release ${{ github.ref_name }}: update manifest/app.json"
          git push origin main
