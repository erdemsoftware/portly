name: v2 cross-platform

# Portly 2 (Windows, macOS, Linux) checks on main and the v2 branches: build, engine tests, packages, UI and screenshots.
# Nothing is released or signed here.
on:
  push:
    branches: [main, v2, 'v2-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/Portly.Desktop/Portly.Desktop.csproj -c Release --nologo

      - name: Engine tests
        shell: bash
        run: |
          export PORTLY_HOME="$RUNNER_TEMP/portly-tests"
          dotnet run --project tests/Portly.CoreTests -c Release

      - name: End-to-end (real packages, real services)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PORTLY_HOME="$RUNNER_TEMP/portly-e2e" PORTLY_E2E=1
          dotnet run --project tests/Portly.CoreTests -c Release --no-build -- E2EInstall
          dotnet run --project tests/Portly.CoreTests -c Release --no-build -- Services

      - uses: actions/upload-artifact@v5
        if: failure() && runner.os != 'Windows'
        with:
          name: e2e-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/portly-e2e/logs/
            ${{ runner.temp }}/portly-e2e/etc/
          if-no-files-found: ignore

      - name: Screenshots
        shell: bash
        run: |
          export PORTLY_HOME="$RUNNER_TEMP/portly-shots"
          mkdir -p shots
          for page in services sites log; do
            dotnet build/desktop/Portly.dll --screenshot "shots/$page.png" 1100 760 --page "$page"
          done
          for dlg in GlyphGallery MessageDialog PackagesForm SettingsForm NewProjectForm; do
            dotnet build/desktop/Portly.dll --screenshot "shots/$dlg.png" 1100 760 --dialog "$dlg" || echo "no preview: $dlg"
          done

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: shots-${{ matrix.os }}
          path: shots/
          if-no-files-found: ignore

  package:
    name: package ${{ matrix.rid }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-24.04 }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64, os: macos-15 }
          - { rid: osx-x64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Package
        run: bash tools/package-unix.sh ${{ matrix.rid }}
      - name: The packaged app starts (headless screenshot)
        shell: bash
        run: |
          export PORTLY_HOME="$RUNNER_TEMP/portly-pkg"
          if [[ "${{ matrix.rid }}" == osx-* ]]; then
            hdiutil attach dist/Portly-[0-9]*.dmg -mountpoint /tmp/portly-dmg -nobrowse
            /tmp/portly-dmg/Portly.app/Contents/MacOS/Portly --screenshot shots/packaged.png 1100 760
            codesign --verify --deep --strict /tmp/portly-dmg/Portly.app
            for i in 1 2 3 4 5; do hdiutil detach /tmp/portly-dmg && break; sleep 3; done || hdiutil detach -force /tmp/portly-dmg
          else
            mkdir -p "$RUNNER_TEMP/x" && tar -xzf dist/Portly-[0-9]*.tar.gz -C "$RUNNER_TEMP/x"
            "$RUNNER_TEMP"/x/Portly-*/Portly --screenshot shots/packaged.png 1100 760
            dpkg-deb --info dist/Portly-[0-9]*.deb | head -12
          fi
          ls -la dist shots
      - uses: actions/upload-artifact@v5
        with:
          name: portly-${{ matrix.rid }}
          path: |
            dist/
            shots/

      # ===== install.sh test (agent "updates"): one-line installer against the files built above, no network =====
      - name: install.sh installs the packages built above and the app starts
        shell: bash
        run: |
          set -euo pipefail
          export PORTLY_HOME="$RUNNER_TEMP/portly-inst-home"
          mkdir -p shots
          test -s dist/SHA256SUMS
          if [[ "${{ matrix.rid }}" == osx-* ]]; then
            PORTLY_INSTALL_FROM="$PWD/dist" PORTLY_APPS_DIR="$RUNNER_TEMP/apps" sh tools/install.sh
            APP="$RUNNER_TEMP/apps/Portly.app"
            if xattr -p com.apple.quarantine "$APP" >/dev/null 2>&1; then echo "quarantine flag is still set"; exit 1; fi
            codesign --verify --deep --strict "$APP"
            "$APP/Contents/MacOS/Portly" --screenshot shots/installed.png 1100 760
          else
            PORTLY_INSTALL_FROM="$PWD/dist" PORTLY_PREFIX="$RUNNER_TEMP/inst" sh tools/install.sh
            test -x "$RUNNER_TEMP/inst/bin/portly"
            grep -q '^Exec=' "$RUNNER_TEMP/inst/share/applications/portly.desktop"
            test -f "$RUNNER_TEMP/inst/share/icons/hicolor/256x256/apps/portly.png"
            "$RUNNER_TEMP/inst/bin/portly" --screenshot shots/installed.png 1100 760
          fi
          test -s shots/installed.png
      - name: install.sh refuses a wrong checksum
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/bad" && mkdir -p "$RUNNER_TEMP/bad"
          cp dist/Portly-*-*.* "$RUNNER_TEMP/bad/"
          sed -E 's/^[0-9a-f]{8}/00000000/' dist/SHA256SUMS > "$RUNNER_TEMP/bad/SHA256SUMS"
          if PORTLY_INSTALL_FROM="$RUNNER_TEMP/bad" PORTLY_APPS_DIR="$RUNNER_TEMP/apps-bad" PORTLY_PREFIX="$RUNNER_TEMP/inst-bad" sh tools/install.sh; then
            echo "the installer accepted a wrong checksum"; exit 1
          fi
          test ! -e "$RUNNER_TEMP/apps-bad/Portly.app"
          test ! -e "$RUNNER_TEMP/inst-bad/share/portly"
      # ===== end of the install.sh test =====

  package-windows:
    name: package win-x64
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Package
        shell: pwsh
        run: ./tools/package-windows.ps1 -Rid win-x64
      - name: The packaged app starts (headless screenshot)
        shell: bash
        run: |
          set -euo pipefail
          export PORTLY_HOME="$RUNNER_TEMP/portly-pkg"
          mkdir -p shots "$RUNNER_TEMP/x"
          unzip -q dist/Portly-[0-9]*-windows-x64.zip -d "$RUNNER_TEMP/x"
          test -f "$RUNNER_TEMP/x/Portly/lang/en.json"
          "$RUNNER_TEMP/x/Portly/Portly.exe" --screenshot shots/packaged.png 1100 760
          test -s shots/packaged.png
          ls -la dist
      - uses: actions/upload-artifact@v5
        with:
          name: portly-win-x64
          path: |
            dist/
            shots/

  ui:
    name: ui ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # the real main window runs headless (Skia) and is clicked through: services, navigation, projects, dialogs, packages
      - name: UI flow tests (real packages, real services)
        shell: bash
        run: |
          export PORTLY_HOME="$RUNNER_TEMP/portly-ui" PORTLY_UI_SHOTS="$GITHUB_WORKSPACE/ui-shots"
          dotnet run --project tests/Portly.UiTests -c Release

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ui-shots-${{ matrix.os }}
          path: ui-shots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: ui-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/portly-ui/logs/
            ${{ runner.temp }}/portly-ui/etc/
          if-no-files-found: ignore

  smoke:
    name: real window ${{ matrix.rid }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-24.04 }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64, os: macos-15 }
          - { rid: osx-x64, os: macos-15-intel }
          - { rid: win-x64, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # macOS / Linux: the packaged app that the package job made
      - uses: actions/download-artifact@v5
        if: runner.os != 'Windows'
        with:
          name: portly-${{ matrix.rid }}
          path: pkg

      - name: Linux - the packaged app in a virtual X display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick x11-apps
          mkdir -p "$RUNNER_TEMP/x" && tar -xzf pkg/dist/Portly-[0-9]*.tar.gz -C "$RUNNER_TEMP/x"
          PROGRAM=$(ls "$RUNNER_TEMP"/x/Portly-*/Portly)
          export PORTLY_HOME="$RUNNER_TEMP/portly-smoke"
          xvfb-run -a --server-args="-screen 0 1280x800x24" bash tests/smoke/smoke-window.sh "$PROGRAM" "$GITHUB_WORKSPACE/smoke/window-${{ matrix.rid }}.png" linux

      - name: macOS - Portly.app on the runner's desktop
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil attach pkg/dist/Portly-[0-9]*.dmg -mountpoint /tmp/portly-dmg -nobrowse
          export PORTLY_HOME="$RUNNER_TEMP/portly-smoke"
          bash tests/smoke/smoke-window.sh /tmp/portly-dmg/Portly.app/Contents/MacOS/Portly "$GITHUB_WORKSPACE/smoke/window-${{ matrix.rid }}.png" mac || rc=$?
          for i in 1 2 3 4 5; do hdiutil detach /tmp/portly-dmg && break; sleep 3; done || hdiutil detach -force /tmp/portly-dmg
          exit ${rc:-0}

      - uses: actions/setup-dotnet@v5
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'

      - name: Windows - build/desktop/Portly.exe on the runner's desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet build src/Portly.Desktop/Portly.Desktop.csproj -c Release --nologo -v:q
          $env:PORTLY_HOME = Join-Path $env:RUNNER_TEMP 'portly-smoke'
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          $p = Start-Process -FilePath (Resolve-Path build/desktop/Portly.exe) -PassThru
          Start-Sleep -Seconds 25
          $fail = 0
          if (-not $p.HasExited) { 'PASS process alive after 25 s' } else { 'FAIL process died early, exit code ' + $p.ExitCode; $fail = 1 }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $shot = Join-Path (Get-Location) 'smoke/window-win-x64.png'
          $bmp.Save($shot, [System.Drawing.Imaging.ImageFormat]::Png)
          if ((Get-Item $shot).Length -gt 0) { 'PASS screenshot ' + (Get-Item $shot).Length + ' bytes' } else { 'FAIL no screenshot'; $fail = 1 }
          Start-Sleep -Seconds 5
          if (-not $p.HasExited) { 'PASS process alive after 30 s' } else { 'FAIL process died'; $fail = 1 }
          $log = Join-Path $env:PORTLY_HOME 'logs/portly.log'
          if (Test-Path $log) {
            '---- portly.log'; Get-Content $log; '----'
            if (Select-String -Path $log -Pattern 'ERROR' -Quiet) { 'FAIL ERROR line in portly.log'; $fail = 1 } else { 'PASS no ERROR in portly.log' }
          } else { 'FAIL no portly.log written'; $fail = 1 }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          exit $fail

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-${{ matrix.rid }}
          path: smoke/
          if-no-files-found: ignore
