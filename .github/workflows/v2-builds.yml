name: v2 own builds

# Portly's own portable builds for macOS and Linux: nginx, Apache httpd, memcached and PHP (php-fpm + php-cli + Xdebug).
# Artifacts only: nothing is released or uploaded anywhere from here. Scripts: tools/own-builds/.
on:
  push:
    branches: [v2-own-builds]
  workflow_dispatch:
    inputs:
      components:
        description: 'Only these (comma separated: nginx,httpd,memcached,php). Empty = all'
        default: ''
      php_set:
        description: 'PHP extension set: full (like the static-php bulk builds) or quick (to try the build chain)'
        default: 'full'
      linux_target:
        description: 'Optional SPC_TARGET for PHP on Linux (for example native-native-gnu.2.17). Empty = glibc of the runner'
        default: ''

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      components: ${{ steps.p.outputs.components }}
      php: ${{ steps.p.outputs.php }}
    steps:
      - id: p
        env:
          WANT: ${{ inputs.components }}
        run: |
          [ -n "$WANT" ] || WANT="nginx,httpd,memcached,php"
          list=""
          for c in nginx httpd memcached; do
            case ",$WANT," in *",$c,"*) list="$list${list:+,}\"$c\"" ;; esac
          done
          echo "components=[$list]" >> "$GITHUB_OUTPUT"
          case ",$WANT," in *",php,"*) echo "php=true" >> "$GITHUB_OUTPUT" ;; *) echo "php=false" >> "$GITHUB_OUTPUT" ;; esac

  build:
    name: ${{ matrix.component }} ${{ matrix.platform.id }}
    needs: plan
    if: needs.plan.outputs.components != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.components) }}
        platform: ${{ fromJSON('[{"id":"linux-x64","runner":"ubuntu-22.04"},{"id":"linux-arm64","runner":"ubuntu-22.04-arm"},{"id":"macos-arm64","runner":"macos-15"},{"id":"macos-x64","runner":"macos-15-intel"}]') }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: bash tools/own-builds/build-${{ matrix.component }}.sh
      - name: Smoke test
        run: bash tools/own-builds/smoke.sh ${{ matrix.component }} ob-out/*.tar.gz
      - uses: actions/upload-artifact@v5
        with:
          name: own-${{ matrix.component }}-${{ matrix.platform.id }}
          path: ob-out/*.tar.gz
          retention-days: 30

  php:
    name: php ${{ matrix.line }} ${{ matrix.platform.id }}
    needs: plan
    if: needs.plan.outputs.php == 'true'
    strategy:
      fail-fast: false
      matrix:
        line: ['8.5', '8.4']
        platform: ${{ fromJSON('[{"id":"linux-x64","runner":"ubuntu-22.04"},{"id":"linux-arm64","runner":"ubuntu-22.04-arm"},{"id":"macos-arm64","runner":"macos-15"},{"id":"macos-x64","runner":"macos-15-intel"}]') }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 340
    env:
      SPC_TARGET: ${{ inputs.linux_target }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          if [ -z "$SPC_TARGET" ]; then unset SPC_TARGET; fi
          bash tools/own-builds/build-php.sh ${{ matrix.line }} ${{ inputs.php_set || 'full' }}
      - name: Smoke test
        run: bash tools/own-builds/smoke.sh php ob-out/*.tar.gz
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: own-php-${{ matrix.line }}-${{ matrix.platform.id }}
          path: ob-out/*.tar.gz
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: spc-logs-php-${{ matrix.line }}-${{ matrix.platform.id }}
          path: ob-work/spc-${{ matrix.line }}/log/
          if-no-files-found: ignore

  collect:
    name: SHA256SUMS
    needs: [build, php]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.php.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: own-*
          path: all
          merge-multiple: true
      - name: Checksums
        run: |
          cd all
          sha256sum *.tar.gz | tee SHA256SUMS
          ls -la
      - uses: actions/upload-artifact@v5
        with:
          name: own-builds-all
          path: all/
          retention-days: 30

  engine:
    name: Portly engine with the packages (${{ matrix.os }})
    needs: collect
    if: ${{ !cancelled() && needs.collect.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v5
        with:
          name: own-builds-all
          path: own-builds
      - name: Build
        run: dotnet build tests/Portly.CoreTests/Portly.CoreTests.csproj -c Release --nologo -v:q
      - name: Engine tests with the own builds
        shell: bash
        run: |
          export PORTLY_HOME="$RUNNER_TEMP/portly-ob" PORTLY_E2E=1 PORTLY_OWN_BUILDS="$PWD/own-builds"
          dotnet run --project tests/Portly.CoreTests -c Release --no-build -- OwnBuilds
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: engine-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/portly-ob/logs/
            ${{ runner.temp }}/portly-ob/etc/
          if-no-files-found: ignore
